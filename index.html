<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de Rendimiento y Ocio</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: rgba(22, 27, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.25);
      --green: #2ea043;
      --green-glow: rgba(46, 160, 67, 0.2);
      --purple: #bc8cff;
      --purple-glow: rgba(188, 140, 255, 0.25);
      --amber: #d29922;
      --amber-glow: rgba(210, 153, 34, 0.25);
      --red: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
    }

    .header-section {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 16px;
    }

    .banner-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, rgba(88, 166, 255, 0.1) 0%, rgba(188, 140, 255, 0.05) 100%);
    }

    .banner-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner-title i {
      color: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .banner-sub {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 6px;
    }

    .metric-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 10px 0 4px;
    }

    .metric-num {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .metric-num.ocio {
      color: var(--purple);
      text-shadow: 0 0 16px var(--purple-glow);
    }

    .metric-num.estudio {
      color: var(--accent);
      text-shadow: 0 0 16px var(--accent-glow);
    }

    .metric-unit {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .metric-foot {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .timer-section {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 20px;
    }

    .timer-display-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      background: rgba(13, 17, 23, 0.7);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      position: relative;
    }

    .timer-mode-pills {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 3px;
      gap: 4px;
      margin-bottom: 14px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background: var(--accent);
      color: #0f1115;
    }

    .timer-clock {
      font-size: 3.6rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
      margin-bottom: 8px;
    }

    .timer-status-badge {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-timer {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      transition: all 0.2s;
    }

    .btn-start {
      background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
      color: #fff;
      box-shadow: 0 4px 12px var(--green-glow);
    }
    .btn-start:hover { transform: translateY(-1px); }

    .btn-pause {
      background: linear-gradient(135deg, #b08800 0%, #d29922 100%);
      color: #fff;
      box-shadow: 0 4px 12px var(--amber-glow);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      flex: 0.5;
    }
    .btn-reset:hover { color: var(--red); border-color: rgba(248, 81, 73, 0.3); }

    .timer-config {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .config-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .config-item {
      background: rgba(13, 17, 23, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
    }

    .config-item label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .config-item select, .config-item input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .slider-box {
      background: rgba(13, 17, 23, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    input[type=range] {
      width: 100%;
      height: 6px;
      background: #21262d;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--purple);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px var(--purple-glow);
    }

      position: relative;
      height: 220px;
      width: 10
